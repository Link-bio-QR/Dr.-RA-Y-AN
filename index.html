<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#499e9d">
<title>Dr. Rayan Veterinary Clinic</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --teal:#499e9d;
  --dark:#176564;
  --deep:#0d4f4e;
  --white:#fff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  overflow-x:hidden;
  font-family:"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  color:#123333;
  background:
    radial-gradient(circle at 50% 8%,rgba(255,255,255,.55),transparent 25%),
    radial-gradient(circle at 8% 75%,rgba(255,255,255,.15),transparent 25%),
    radial-gradient(circle at 92% 40%,rgba(255,255,255,.13),transparent 24%),
    linear-gradient(145deg,#a8dedb 0%,#499e9d 45%,#216f6e 100%);
  position:relative;
}

/* Beautiful veterinary background */
.vet-bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}
.vet-bg i{
  position:absolute;
  display:grid;
  place-items:center;
  color:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.035);
  box-shadow:0 10px 35px rgba(7,65,64,.08), inset 0 1px rgba(255,255,255,.08);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  animation:floatIcon 8s ease-in-out infinite;
}
.vet-bg i:nth-child(1){width:105px;height:105px;border-radius:50%;font-size:48px;top:5%;left:4%}
.vet-bg i:nth-child(2){width:85px;height:85px;border-radius:28px;font-size:38px;top:18%;right:5%;animation-delay:-2s}
.vet-bg i:nth-child(3){width:120px;height:120px;border-radius:50%;font-size:52px;top:42%;left:-30px;animation-delay:-5s}
.vet-bg i:nth-child(4){width:90px;height:90px;border-radius:30px;font-size:40px;top:62%;right:-15px;animation-delay:-1s}
.vet-bg i:nth-child(5){width:80px;height:80px;border-radius:50%;font-size:34px;bottom:10%;left:7%;animation-delay:-4s}
.vet-bg i:nth-child(6){width:110px;height:110px;border-radius:32px;font-size:45px;bottom:3%;right:6%;animation-delay:-6s}
.vet-bg i:nth-child(7){font-size:32px;background:none;border:0;top:34%;right:15%;animation-delay:-3s}
.vet-bg i:nth-child(8){font-size:30px;background:none;border:0;bottom:25%;left:18%;animation-delay:-7s}

@keyframes floatIcon{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-18px) rotate(5deg)}
}

/* glowing orbs */
.orb{
  position:fixed;
  width:300px;height:300px;
  border-radius:50%;
  background:rgba(255,255,255,.13);
  filter:blur(65px);
  pointer-events:none;
  z-index:0;
  animation:orb 10s ease-in-out infinite alternate;
}
.orb.a{left:-130px;top:30%}
.orb.b{right:-120px;bottom:15%;animation-delay:-5s}
@keyframes orb{
  to{transform:translate(45px,-35px) scale(1.15)}
}

main{
  position:relative;
  z-index:2;
  width:min(680px,100%);
  margin:auto;
  padding:32px 18px 22px;
}

/* Circular logo frame */
.logo-wrap{
  width:285px;
  height:285px;
  margin:0 auto 24px;
  padding:13px;
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center;
  background:
    linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.24));
  border:2px solid rgba(255,255,255,.75);
  box-shadow:
    0 25px 60px rgba(7,67,66,.34),
    0 8px 20px rgba(0,0,0,.15),
    inset 0 2px 3px rgba(255,255,255,.9),
    inset 0 -10px 25px rgba(20,100,99,.13);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  animation:logoFloat 5s ease-in-out infinite;
}
.logo-wrap::before{
  content:"";
  position:absolute;
  inset:-7px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.28);
  box-shadow:0 0 35px rgba(255,255,255,.22);
}
.logo-wrap::after{
  content:"";
  position:absolute;
  width:65px;height:65px;
  top:-14px;right:26px;
  border-radius:50%;
  background:rgba(255,255,255,.25);
  filter:blur(4px);
}
.logo{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 12px 28px rgba(0,0,0,.22),
    inset 0 0 0 1px rgba(255,255,255,.8);
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.paw-divider{
  display:flex;
  align-items:center;
  gap:15px;
  margin:0 auto 20px;
  max-width:510px;
}
.paw-divider span{
  height:2px;
  flex:1;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));
  box-shadow:0 0 12px rgba(255,255,255,.5);
}
.paw-divider span:last-child{
  background:linear-gradient(90deg,rgba(255,255,255,.9),transparent);
}
.paw{
  width:52px;height:52px;
  display:grid;
  place-items:center;
  color:var(--dark);
  background:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.9);
  border-radius:50%;
  box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 2px rgba(255,255,255,.9);
  animation:pulse 2.5s infinite;
}
@keyframes pulse{
  50%{transform:scale(1.09);box-shadow:0 0 30px rgba(255,255,255,.6)}
}

h1{
  text-align:center;
  color:#fff;
  font-size:clamp(24px,6vw,39px);
  line-height:1.55;
  text-shadow:0 5px 18px rgba(0,0,0,.2);
}
.doctor{
  text-align:center;
  color:#fff;
  font-size:clamp(21px,5vw,30px);
  font-weight:800;
  margin-top:5px;
  text-shadow:0 5px 18px rgba(0,0,0,.2);
}
.degree{
  text-align:center;
  direction:ltr;
  color:#fff;
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
  margin:5px 0 25px;
}

.links{
  display:grid;
  gap:14px;
}
.link{
  min-height:70px;
  display:flex;
  align-items:center;
  direction:ltr;
  text-decoration:none;
  color:#123333;
  padding:10px 14px;
  border-radius:24px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.40),rgba(255,255,255,.13));
  border:1px solid rgba(255,255,255,.46);
  box-shadow:
    0 18px 42px rgba(8,67,66,.25),
    inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  transition:.35s ease;
}
.link::before{
  content:"";
  position:absolute;
  top:0;bottom:0;width:45%;
  left:-60%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-20deg);
  transition:.7s;
}
.link:hover::before{left:120%}
.link:hover{
  transform:translateY(-5px) scale(1.015);
  box-shadow:0 28px 58px rgba(7,62,61,.35),inset 0 1px #fff;
}
.link:active{transform:scale(.98)}

.icon{
  width:50px;height:50px;
  flex:0 0 50px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:22px;
  border-radius:17px;
  background:linear-gradient(145deg,#6bc0bd,#277b7a);
  box-shadow:0 10px 20px rgba(20,100,99,.3),inset 0 1px rgba(255,255,255,.55);
  transition:.35s;
}
.link:hover .icon{transform:scale(1.1) rotate(-5deg)}
.label{
  flex:1;
  text-align:left;
  padding:0 16px;
  font-size:20px;
  font-weight:800;
}
.arrow{opacity:.6;transition:.35s}
.link:hover .arrow{transform:translateX(-6px)}

.heartbeat{
  height:120px;
  position:relative;
  display:grid;
  place-items:center;
  margin-top:18px;
}
.heart{
  color:#fff;
  font-size:67px;
  filter:drop-shadow(0 0 14px rgba(255,255,255,.8));
  animation:heartBeat 1.5s infinite;
}
@keyframes heartBeat{
  0%,100%{transform:scale(1)}
  12%{transform:scale(1.14)}
  24%{transform:scale(1)}
  36%{transform:scale(1.08)}
  50%{transform:scale(1)}
}
.ekg{
  position:absolute;
  width:290px;
  max-width:70%;
}
.ekg path{
  fill:none;
  stroke:#fff;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:400;
  stroke-dashoffset:400;
  animation:draw 2.7s linear infinite;
  filter:drop-shadow(0 0 5px rgba(255,255,255,.9));
}
@keyframes draw{to{stroke-dashoffset:0}}

.address{
  display:flex;
  align-items:center;
  gap:13px;
  padding:18px 20px;
  color:#fff;
  font-weight:700;
  font-size:16px;
  line-height:1.8;
  border-radius:23px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 18px 45px rgba(8,67,66,.25),inset 0 1px rgba(255,255,255,.65);
  backdrop-filter:blur(17px);
  -webkit-backdrop-filter:blur(17px);
}
.address i{font-size:25px;flex:0 0 auto}

footer{
  text-align:center;
  color:rgba(255,255,255,.9);
  font-size:13px;
  padding:24px 0 5px;
}

@media(max-width:520px){
  main{padding:22px 13px 15px}
  .logo-wrap{width:255px;height:255px}
  .link{min-height:65px;border-radius:21px}
  .icon{width:46px;height:46px;flex-basis:46px}
  .label{font-size:18px}
  .address{font-size:14px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
